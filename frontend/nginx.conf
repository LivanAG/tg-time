server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  # Un poco más que los 2 MB del Excel: así el límite lo aplica Spring y responde con ProblemDetail.
  client_max_body_size 3m;

  # DNS interno de Docker: "backend" se resuelve en cada petición, así un redeploy del backend
  # (nueva IP) no deja a nginx apuntando al contenedor antiguo.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Las cabeceras de seguridad de /api las pone Spring Security.
  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    # Caddy ya fija X-Forwarded-For a la IP real del cliente; aquí solo se añade el salto.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Solo el estado UP/DOWN, sin detalles (indicador del frontend y monitorización externa).
  location = /actuator/health {
    proxy_pass $backend;
  }

  # add_header no se hereda en un location que define los suyos: por eso el include en cada uno.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
