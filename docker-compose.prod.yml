# Producción en la VM de Oracle Cloud (make deploy TAG=...). Backend y frontend se descargan de GHCR.
# Aquí se exigen los valores reales: si falta alguno, docker compose se niega a arrancar.
x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

services:
  db:
    <<: *hardening
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]   # mínimo que necesita postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en .env}
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}

  backend:
    <<: *hardening
    build: !reset null                       # en prod solo se usan imágenes publicadas
    read_only: true
    tmpfs: [/tmp]
    deploy: { resources: { limits: { memory: 768m, cpus: "1.0" } } }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env}
      DB_USER: ${DB_USER:?Define DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      # Solo para crear el primer usuario; después se pueden borrar del .env.
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ALLOWED_ORIGINS: https://${DOMAIN:?Define DOMAIN en .env}
      APP_COOKIE_SECURE: "true"

  frontend:
    <<: *hardening
    build: !reset null
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      frontend: { condition: service_healthy }

  backup:
    <<: *hardening
    build: ./deploy/backup                   # postgres:16-alpine + gnupg; se construye en la VM
    image: local/control-horario-backup
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:?Define DB_NAME en .env}
      PGUSER: ${DB_USER:?Define DB_USER en .env}
      PGPASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?Define BACKUP_PASSPHRASE en .env}
      RETENTION_DAYS: 14
      TZ: Europe/Madrid
    volumes: ["./backups:/backups"]
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }

volumes:
  caddy_data: {}
  caddy_config: {}
