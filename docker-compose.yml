# Base común. Desarrollo:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#              Producción:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (o simplemente `make dev` / `make deploy`).
name: control-horario

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    image: ${REGISTRY:-local}/control-horario-backend:${TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Europe/Madrid
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  frontend:
    build: ./frontend
    image: ${REGISTRY:-local}/control-horario-frontend:${TAG:-latest}
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal, edge]

networks:
  internal: { internal: true }        # db y backend sin salida a internet
  edge: {}
volumes:
  pgdata: {}
